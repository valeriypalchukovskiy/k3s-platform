---
- name: Common setup for all K3s nodes
  hosts: all
  become: yes
  
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - git
          - ufw
          - fail2ban
          - ca-certificates
          - apt-transport-https
        state: present
    
    - name: Disable swap (Kubernetes requirement)
      command: swapoff -a
      when: ansible_swaptotal_mb > 0
    
    - name: Remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: ' swap '
        state: absent
    
    - name: Configure UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }
    
    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp
    
    - name: Enable UFW
      ufw:
        state: enabled
    
    - name: Enable and start fail2ban
      systemd:
        name: fail2ban
        enabled: yes
        state: started
    
    - name: Set hostname
      hostname:
        name: "{{ inventory_hostname }}"

- name: Setup K3s Master Node
  hosts: master
  become: yes
  vars:
    k3s_version: "v1.36.2+k3s1"
  
  tasks:
    - name: Allow K3s API port
      ufw:
        rule: allow
        port: '6443'
        proto: tcp
    
    - name: Allow HTTP/HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'
    
    - name: Allow Flannel VXLAN
      ufw:
        rule: allow
        port: '8472'
        proto: udp
    
    - name: Install K3s server
      shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_EXEC="--disable traefik --disable servicelb" sh -
      args:
        creates: /usr/local/bin/k3s
    
    - name: Wait for K3s to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 300
    
    - name: Create .kube directory for user
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        mode: '0755'
    
    - name: Copy kubeconfig to user home
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ ansible_user }}/.kube/config"
        owner: "{{ ansible_user }}"
        mode: '0600'
        remote_src: yes
    
    - name: Get node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token
    
    - name: Save token for workers
      set_fact:
        k3s_token: "{{ node_token.content | b64decode | trim }}"

- name: Setup K3s Worker Nodes
  hosts: worker
  become: yes
  vars:
    k3s_version: "v1.36.2+k3s1"
  
  tasks:
    - name: Allow Kubelet API
      ufw:
        rule: allow
        port: '10250'
        proto: tcp
    
    - name: Allow Flannel VXLAN
      ufw:
        rule: allow
        port: '8472'
        proto: udp
    
    - name: Install K3s agent
      shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_URL="https://{{ hostvars[groups['master'][0]].ansible_host }}:6443" \
          K3S_TOKEN="{{ hostvars[groups['master'][0]].k3s_token }}" sh -
      args:
        creates: /usr/local/bin/k3s
