---
- name: Setup K3s Master Node
  hosts: master
  become: yes
  vars:
    k3s_version: "v1.36.2+k3s1"
  
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
    
    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - git
          - ufw
          - fail2ban
          - ca-certificates
          - apt-transport-https
        state: present
    
    - name: Disable swap (required for Kubernetes)
      command: swapoff -a
      when: ansible_swaptotal_mb > 0
    
    - name: Remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: ' swap '
        state: absent
    
    - name: Configure UFW - allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp
    
    - name: Configure UFW - allow HTTP/HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'
    
    - name: Configure UFW - allow K3s API
      ufw:
        rule: allow
        port: '6443'
        proto: tcp
    
    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny
        direction: incoming
    
    - name: Enable and start fail2ban
      systemd:
        name: fail2ban
        enabled: yes
        state: started
    
    - name: Install K3s
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" \
          INSTALL_K3S_EXEC="--disable traefik --disable servicelb" sh -
      args:
        creates: /usr/local/bin/k3s
    
    - name: Wait for K3s to be ready
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 300
    
    - name: Get node token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token
    
    - name: Save token for worker nodes
      set_fact:
        k3s_token: "{{ node_token.content | b64decode | trim }}"
      delegate_to: localhost

- name: Setup K3s Worker Node
  hosts: worker
  become: yes
  vars:
    k3s_version: "v1.36.2+k3s1"
  
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
    
    - name: Install required packages
      apt:
        name:
          - curl
          - ufw
          - fail2ban
        state: present
    
    - name: Disable swap
      command: swapoff -a
      when: ansible_swaptotal_mb > 0
    
    - name: Remove swap from fstab
      lineinfile:
        path: /etc/fstab
        regexp: ' swap '
        state: absent
    
    - name: Configure UFW
      ufw:
        rule: allow
        port: "{{ item }}"
      loop:
        - '22'
        - '80'
        - '443'
        - '10250'  # Kubelet API
        - '8472'   # Flannel VXLAN
    
    - name: Enable UFW
      ufw:
        state: enabled
    
    - name: Install K3s agent
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" \
          K3S_URL="https://{{ hostvars['k3s-master'].ansible_host }}:6443" \
          K3S_TOKEN="{{ hostvars['k3s-master'].k3s_token }}" sh -
      args:
        creates: /usr/local/bin/k3s
